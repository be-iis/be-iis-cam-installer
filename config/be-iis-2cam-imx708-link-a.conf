# BE-IIS GMSL2 2CAM HAT — validated Link-A DigiPot settings
#
# Target: Raspberry Pi 5, MAX96716A + MAX96717F, IMX708 over GMSL2 coax.
# DigiPot channel B is written as:
#   i2ctransfer -f -y 11 w2@0x51 0x01 <value>
#
# Tested 2026-08-25. There is no common error-free setting for both modes.
# Select the value for the active IMX708 sensor mode before starting capture.

IMX708_2304X1296_DIGIPOT_B=0xba
IMX708_4608X2592_DIGIPOT_B=0xb0
